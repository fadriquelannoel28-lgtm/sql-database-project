<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-center">
    <div class="login">
        <h1>Water Cleanup Movement</h1>
        <h2>Login</h2>
        <form method="POST">
            {{ form.hidden_tag() }} 

            <div class="flex-login">
                {{ form.username.label }}
                {{ form.username(size=32) }}
            </div>

            <div class="flex-login">
                {{ form.password.label }}
                {{ form.password(size=32) }}
            </div>

            <button type="submit">{{ form.submit.label.text }}</button><br><br>

            <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </form>
    </div>
</body>
</html>
